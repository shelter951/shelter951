name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: shelter951
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23ff8a00&color_dots=%23ebedf0,%23d7f5dd,%239be9a8,%2340c463,%2330a14e
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ffb347&color_dots=%23161b22,%230f2d1f,%231b5e20,%232ea043,%2356d364

      - name: Publish snake animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
